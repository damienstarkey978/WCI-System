name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wcios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The app never connects during lint/typecheck/test/build — the Prisma client is
      # created lazily — but migrations and the seed smoke test do.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wcios_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs postinstall -> prisma generate, which the generated client needs.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed smoke test
        run: npm run db:seed

      - name: Build
        run: npm run build
